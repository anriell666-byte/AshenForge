name: AFTERFALL Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Validate and build AFTERFALL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0 cmdline-tools;latest ndk;23.2.8568313 cmake;3.10.2.4988404"
      - name: Download Godot 4.4.1
        run: |
          mkdir -p "$HOME/godot"
          curl -fL "https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip" -o "$HOME/godot/godot.zip"
          unzip -o "$HOME/godot/godot.zip" -d "$HOME/godot"
          chmod +x "$HOME/godot/Godot_v4.4.1-stable_linux.x86_64"
      - name: Install export templates
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates/4.4.1.stable"
          curl -fL "https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz" -o "$HOME/godot/templates.tpz"
          unzip -o "$HOME/godot/templates.tpz" -d "$HOME/godot/templates"
          cp "$HOME/godot/templates/templates/"* "$HOME/.local/share/godot/export_templates/4.4.1.stable/"
      - name: Configure Android paths
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "/usr/local/lib/android/sdk"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF
      - name: Prepare persistent debug signing key
        run: |
          test -f android/afterfall-debug.keystore
      - name: Validate project
        shell: bash
        run: |
          set -o pipefail
          GODOT="$HOME/godot/Godot_v4.4.1-stable_linux.x86_64"
          "$GODOT" --headless --editor --path . --import 2>&1 | tee godot-import.log
          "$GODOT" --headless --path . --quit 2>&1 | tee godot-runtime-check.log
          if grep -E "SCRIPT ERROR:|Parse Error:|Failed to load script|ERROR: Failed to load" godot-import.log godot-runtime-check.log; then exit 1; fi
      - name: Export APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ github.workspace }}/android/afterfall-debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: afterfalldebug
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: afterfall-debug-key
        run: |
          mkdir -p build
          sed -i "s/^version\/code=.*/version\/code=${GITHUB_RUN_NUMBER}/" export_presets.cfg
          "$HOME/godot/Godot_v4.4.1-stable_linux.x86_64" --headless --path . --export-debug Android build/afterfall-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: afterfall-android-debug
          path: build/afterfall-debug.apk
          if-no-files-found: error
          retention-days: 14
